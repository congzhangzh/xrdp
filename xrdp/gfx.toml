[codec]
# "AV1" (FreeRDP's extension; xrdp built with --enable-av1) may be added
# first, e.g. [ "AV1", "H.264", "RFX" ]: other clients get the next codec.
# The same for "AV2" (xrdp built with --enable-av2), e.g.
# [ "AV2", "AV1", "H.264", "RFX" ]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder, "x264" or "OpenH264".
# This parameter takes effect only when more than one encoder is
# enabled at compile time. If only one encoder is enabled, the encoder
# will be used regardless the value of this parameter.
h264_encoder = "x264"

#
# Configurations for x264
#
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "superfast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

# Configurations for AV1 (libaom), used when "AV1" is in the codec order.
# The section is optional; connection types inherit [AV1.default] as above,
# and missing parameters take the values shown. XRDP_GFX_AV1_<NAME> in
# xrdp's environment (e.g. XRDP_GFX_AV1_THREADS in /etc/default/xrdp)
# overrides a parameter for every connection type.
[AV1.default]
# CPU threads per screen for AV1 encoding, 1 to 64. More threads encode
# large screens faster, but each user and screen gets that many.
threads = 2
# Speed, 5 (slower) to 12 (fastest): 8 makes about 10% smaller frames
cpu_used = 10
# Constant quality, 0 (best) to 63, used when target_bitrate is 0
cq_level = 28
# A bitrate in kbps, or 0 for constant quality. A single second can take
# 1.4 to 2 times the target: set about 0.7 of what the link carries
target_bitrate = 0
# Chroma subsampling: "auto" encodes 4:4:4 (AV1 profile 1) when the client
# offers it and the session sends full colour (Wayland, GNOME), else
# 4:2:0 (profile 0); "420" always 4:2:0, for clients that decode in
# hardware; "444" as "auto", with a warning when 4:4:4 is not possible
chroma = "auto"

[AV1.broadband_low]
cpu_used = 8
target_bitrate = 1_100

[AV1.modem]
cpu_used = 8
target_bitrate = 800

# Configurations for AV2 (libavm, the AV2 reference), used when "AV2" is in
# the codec order. As [AV1]: optional, connection types inherit
# [AV2.default], and XRDP_GFX_AV2_<NAME> in xrdp's environment overrides a
# parameter for every connection type. The values shown are the defaults,
# measured at 2560x1440 on 4 cores.
[AV2.default]
# CPU threads per screen for AV2 encoding, 1 to 64: rows and tile columns
# are encoded in parallel
threads = 4
# Speed, 0 (slower) to 9 (fastest), or 10 with a libavm that has it
cpu_used = 9
# Constant quality (a quantizer index), 0 (best) to 255, used when
# target_bitrate is 0
qp = 160
# A bitrate in kbps, or 0 for constant quality
target_bitrate = 0
# Tile columns, as a power of two: 0 (one), 1 (two), 2 (four) ... 6. More
# columns keep more threads busy, at a few percent more bits
tile_columns = 1
# Chroma subsampling, as for AV1: "auto", "420" or "444". 4:4:4 is AV2
# profile 4
chroma = "auto"
