name: wlup end-to-end tests

# Builds xrdp with the wlup module and runs wlup/test/run-all.sh: headless
# sway and GNOME sessions started by sesman, driven by xfreerdp3, each in
# its own container (two of them with systemd as PID 1).
on:
  push:
    paths:
      - 'wlup/**'
      - 'tests/wlup/**'
      - 'sesman/**'
      - 'xrdp/**'
      - 'libipm/**'
      - 'common/**'
      - 'configure.ac'
      - '.github/workflows/wlup-e2e.yml'
  pull_request:
    paths:
      - 'wlup/**'
      - 'tests/wlup/**'
      - 'sesman/**'
      - 'xrdp/**'
      - 'libipm/**'
      - 'common/**'
      - 'configure.ac'
      - '.github/workflows/wlup-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The module core against a mock backend (tests/wlup), in make check
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the test image
        run: docker build -q -t xrdp-wlup-dev wlup/test

      - name: Unit tests (wlroots build; the e2e covers Mutter)
        run: |
          docker run --rm -v "$PWD":/src:ro xrdp-wlup-dev bash -c '
            set -e
            cp -a /src /build && cd /build
            ./bootstrap
            # -Wno-error=nonnull: GCC 16 flags existing code in xrdp/xrdp_mm.c
            ./configure --enable-wlup --enable-tests CFLAGS="-O2 -g -Wno-error=nonnull"
            make -j"$(nproc)"
            make -C tests/wlup check || { cat tests/wlup/test-suite.log; exit 1; }'

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # KWin casts its output only with OpenGL, which takes a DRM render
      # node: the runner has no GPU, vgem gives it one
      - name: Load vgem for the KDE suite
        run: |
          sudo modprobe vgem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vgem
          }
          ls -l /dev/dri

      - name: Run all suites
        run: wlup/test/run-all.sh "$RUNNER_TEMP/wlup-test"

      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wlup-e2e-logs
          path: ${{ runner.temp }}/wlup-test
          if-no-files-found: ignore

  # Slow-link behaviour (wlup/test/run-backpressure.sh): delay before a
  # change shows, memory, output while hidden. Each session on its own
  # runner, as the test measures time
  backpressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        session: [sway, xorg, gnome]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load sch_netem for the slow link
        run: |
          sudo modprobe sch_netem || {
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe sch_netem
          }

      - name: Run the ${{ matrix.session }} session
        run: wlup/test/run-backpressure-all.sh "$RUNNER_TEMP/bp" ${{ matrix.session }}

      - name: Keep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wlup-backpressure-${{ matrix.session }}
          path: ${{ runner.temp }}/bp
          if-no-files-found: ignore
